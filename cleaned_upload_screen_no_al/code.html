<body class="text-on-surface font-body flex flex-col relative min-h-[884px]" data-mode="connect" data-stitch-vh="min-h-[884px]===min-h-screen">
<!-- Subtle White Overlay -->
<div class="fixed inset-0 bg-white/25 pointer-events-none z-0"></div>
<!-- TopAppBar -->
<header class="bg-[#f6fafe]/80 backdrop-blur-md dark:bg-slate-900/80 flex items-center justify-between px-6 py-4 w-full sticky top-0 z-50">
<div class="flex items-center gap-4">
<h1 class="font-['Manrope'] font-bold text-lg tracking-tight text-on-surface">Coral Neural Networks</h1>
</div>
<div class="flex items-center gap-6">
<span class="text-[#006067] font-bold"><br/></span>
<span class="text-slate-500 dark:text-slate-400"><br/></span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-6 lg:p-12 relative overflow-hidden z-10">
<!-- Abstract background elements -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-fixed-dim opacity-20 rounded-full blur-[100px]"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary-container opacity-20 rounded-full blur-[100px]"></div>
<div class="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-center relative z-10">
<!-- Instructions Side (Editorial Typography) -->
<div class="lg:col-span-5 space-y-6">
<div class="space-y-2">
<span class="text-secondary font-semibold tracking-widest text-xs uppercase bg-secondary-container/30 px-3 py-1 rounded-full">New Analysis</span>
<h2 class="font-headline text-4xl lg:text-5xl font-extrabold text-on-surface leading-tight">
                        Upload a photo of coral to begin <span class="text-primary">analysis</span>
</h2>
</div>
</div>
<!-- Upload Area (Interactive Card) -->
<div class="lg:col-span-7">
<div class="bg-surface-container-low rounded-xl p-2">
<!-- The "Inner" Surface -->
<div class="bg-surface-container-lowest rounded-lg border-2 border-dashed border-outline-variant p-12 lg:p-20 flex flex-col items-center justify-center text-center transition-all hover:bg-white group cursor-pointer">
<input accept=".jpg,.jpeg,.png" class="hidden" id="file-upload" type="file"/>
<label class="cursor-pointer flex flex-col items-center" for="file-upload">
<div class="w-24 h-24 rounded-full bg-primary-container/10 text-primary flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined !text-5xl" data-icon="add_a_photo">add_a_photo</span>
</div>
<h3 class="font-headline text-xl font-bold text-on-surface mb-2">Drop your image here</h3>
<p class="text-on-surface-variant max-w-xs mb-8">
                                Select a file from your device.</p>
<!-- Support Info -->
<div class="flex gap-6 justify-center items-center text-outline">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined !text-lg" data-icon="image">image</span>
<span class="text-xs font-semibold tracking-wide uppercase">JPG</span>
</div>
<div class="w-1 h-1 bg-outline-variant rounded-full"></div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined !text-lg" data-icon="high_res">high_res</span>
<span class="text-xs font-semibold tracking-wide uppercase">Up to 25MB</span>
</div>
</div>
</label>
</div>
</div>
<!-- Action Button Area -->
<div class="mt-8 flex flex-col sm:flex-row gap-4 justify-end">
<button class="px-8 py-4 rounded-full bg-surface-container-highest text-outline font-bold tracking-tight hover:bg-surface-container-high transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
                        Cancel
                    </button>
<!-- "Initially Secondary/Disabled Style" as requested -->
<a class="px-10 py-4 rounded-full bg-primary text-on-primary font-bold tracking-tight shadow-sm flex items-center justify-center gap-3 transition-all hover:opacity-90 active:scale-95 cursor-pointer" href="{{DATA:SCREEN:SCREEN_6}}">
                        Analyze Image
                        <span class="material-symbols-outlined" data-icon="analytics">analytics</span>
</a>
</div>
</div>
</div>
</main>
<!-- Marine Context Footer Detail -->
</body></html>
