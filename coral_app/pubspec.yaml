name: coral_app
description: Coral health classification using EfficientNet-B0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image: ^4.8.0
  image_picker: ^1.0.7
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/bg_coral.png
    - assets/app_logo.jpeg
